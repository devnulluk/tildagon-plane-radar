# A GitHub Release makes the tagged source available to the Tildagon App Store.
name: Tildagon release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag and app
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("tildagon.toml").read_text())
          expected = "v" + metadata["metadata"]["version"]
          actual = "${{ github.ref_name }}"
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must match {expected!r}")
          PY
          python -m unittest discover -s tests -v

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
