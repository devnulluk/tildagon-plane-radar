# Validate the Tildagon/MicroPython app on every proposed change.
name: Tildagon tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run host-side tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: >-
          python -m py_compile
          __init__.py adsb.py app.py flight_app.py flight_follow.py
          instructions_qr.py keebdeck.py led_radar.py location_provider.py
          postcode.py radar_base.py radar_math.py route_lookup.py spaceagon.py
          wifi_location.py
